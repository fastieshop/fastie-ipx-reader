<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#0e2638"/><text x="52" y="85" font-family="Arial,sans-serif" font-size="50" font-weight="bold" fill="#ffffff">IPX5–IPX8</text><text x="52" y="125" font-family="Arial,sans-serif" font-size="24" fill="#b4d4e0">Suya dayanıklılık sınıfları | Fastieshop bilgi rehberi</text><rect x="52" y="168" width="270" height="312" rx="20" fill="#d9eef6"/><rect x="52" y="168" width="270" height="94" rx="20" fill="#174b68"/><text x="70" y="233" font-family="Arial,sans-serif" font-size="46" font-weight="bold" fill="white">IPX5</text><text x="70" y="311" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#113e57">Su jeti</text><text x="70" y="362" font-family="Arial,sans-serif" font-size="17" fill="#17445d">Her yönden su jeti</text><path d="M 77 423 Q 127 394 187 422 T 297 421" stroke="#1988b8" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="339" y="168" width="270" height="312" rx="20" fill="#c7e5f1"/><rect x="339" y="168" width="270" height="94" rx="20" fill="#174b68"/><text x="357" y="233" font-family="Arial,sans-serif" font-size="46" font-weight="bold" fill="white">IPX6</text><text x="357" y="311" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#113e57">Güçlü su jeti</text><text x="357" y="362" font-family="Arial,sans-serif" font-size="17" fill="#17445d">Kuvvetli su jeti</text><path d="M 364 423 Q 414 394 474 422 T 584 421" stroke="#1988b8" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="626" y="168" width="270" height="312" rx="20" fill="#b8e0ed"/><rect x="626" y="168" width="270" height="94" rx="20" fill="#174b68"/><text x="644" y="233" font-family="Arial,sans-serif" font-size="46" font-weight="bold" fill="white">IPX7</text><text x="644" y="311" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#113e57">Geçici daldırma</text><text x="644" y="362" font-family="Arial,sans-serif" font-size="17" fill="#17445d">30 dk / yaklaşık 1 m*</text><path d="M 651 423 Q 701 394 761 422 T 871 421" stroke="#1988b8" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="913" y="168" width="270" height="312" rx="20" fill="#a6d9e9"/><rect x="913" y="168" width="270" height="94" rx="20" fill="#174b68"/><text x="931" y="233" font-family="Arial,sans-serif" font-size="46" font-weight="bold" fill="white">IPX8</text><text x="931" y="311" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#113e57">Sürekli daldırma</text><text x="931" y="362" font-family="Arial,sans-serif" font-size="17" fill="#17445d">Koşullar üreticiye bağlı</text><path d="M 938 423 Q 988 394 1048 422 T 1158 421" stroke="#1988b8" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="52" y="512" width="1096" height="90" rx="18" fill="#e1f0f4"/><text x="74" y="551" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#103951">Önemli: IPX7 / IPX8, IPX5 / IPX6 su jeti testlerini otomatik olarak kapsamaz.</text><text x="74" y="582" font-family="Arial,sans-serif" font-size="17" fill="#274e63">IPX8 derinlik ve süresi modele özgüdür; her zaman üretici kılavuzuna bakın.</text><text x="52" y="651" font-family="Arial,sans-serif" font-size="17" fill="#b4d4e0">* IPX7 için küçük mahfazalarda kullanılan test koşulu. Kaynak: IEC 60529.</text></svg>